# Infra services start by default. App services sit behind the "app" profile
# until backend/ contains code:  docker compose --profile app up
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: goodnews
      POSTGRES_USER: goodnews
      POSTGRES_PASSWORD: goodnews
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodnews"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    profiles: [app]
    build: ./backend
    env_file: .env
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    volumes: ["./backend:/app"]
  worker:
    profiles: [app]
    build: ./backend
    env_file: .env
    command: celery -A config worker -l info
    depends_on: [db, redis]
    volumes: ["./backend:/app"]
  beat:
    profiles: [app]
    build: ./backend
    env_file: .env
    command: celery -A config beat -l info
    depends_on: [db, redis]
    volumes: ["./backend:/app"]
volumes:
  pgdata:
